name: 0AD-Bench

on:
  push:
    paths:
      - "0ad-bench/**"
      - ".github/workflows/0ad-bench.yml"
  pull_request:
    paths:
      - "0ad-bench/**"
      - ".github/workflows/0ad-bench.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "./0ad-bench[test]"
      - run: 0ad-bench validate
      - run: pytest 0ad-bench/tests
      - run: 0ad-bench smoke --output /tmp/0ad-bench-smoke
