[project]
name = "the-scientist"
description = "A stateful RL environment for discovering hidden scientific laws through active experimentation."
readme = "README.md"
license = { text = "MIT" }
tags = ["science", "tool-use", "active-learning", "reasoning", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=4.0.0",
    "verifiers>=0.3.0,<0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["the_scientist"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 3

[dependency-groups]
dev = [
    "pytest>=8.0",
]
