[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ad-bench"
version = "0.1.0"
description = "A benchmark for long-horizon autonomous agents in 0 A.D."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]
test = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
0ad-bench = "zero_ad_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zero_ad_bench = ["data/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
